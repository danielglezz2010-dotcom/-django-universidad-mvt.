<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Profesor - {{ profesor.nombre }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1>{{ profesor.nombre }}</h1>

    <h4 class="mt-4">Cursos que dicta:</h4>
    <ul>
        {% for curso in cursos %}
            <li>{{ curso.nombre }} ({{ curso.codigo }})</li>
        {% empty %}
            <li>Este profesor no tiene cursos asignados.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'lista_cursos' %}">Volver al catálogo</a>
</body>
</html>
